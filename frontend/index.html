<title>EduRisk - Student Performance & Risk Analytics</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --tx: #0f172a;
  --mut: #64748b;
  --bd: #e2e8f0;
  --pri: #4f46e5;
  --H: #dc2626;
  --M: #f59e0b;
  --L: #16a34a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0b1020;
    --card: #151b2e;
    --tx: #e8ecf5;
    --mut: #94a3b8;
    --bd: #273049;
    --pri: #818cf8;
  }
}
:root[data-theme=dark] {
  --bg: #0b1020;
  --card: #151b2e;
  --tx: #e8ecf5;
  --mut: #94a3b8;
  --bd: #273049;
  --pri: #818cf8;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 Inter, system-ui, Segoe UI, Arial, sans-serif; }

aside {
  position: fixed;
  inset: 0 auto 0 0;
  width: 240px;
  background: var(--card);
  border-right: 1px solid var(--bd);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 100;
}
aside h1 { font-size: 20px; margin: 0 8px 2px; color: var(--pri); display: flex; align-items: center; gap: 8px; }
aside small { margin: 0 8px 16px; color: var(--mut); }
aside a { padding: 10px 12px; border-radius: 10px; color: var(--mut); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 10px; }
aside a.on, aside a:hover { background: var(--pri); color: #fff; }
aside .theme-btn { margin-top: auto; }

.status-badge {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin: 0 8px 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-badge.ok { background: #dcfce7; color: #166534; }
.status-badge.local { background: #fef3c7; color: #92400e; }

main { margin-left: 240px; padding: 26px 30px; max-width: 1400px; }
h2 { margin: 0 0 4px; font-size: 24px; }
.sub { color: var(--mut); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 2fr 1fr; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px #0001; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 16px; }
.card p { margin: 0 0 12px; color: var(--mut); font-size: 13px; }
.kpi b { font-size: 30px; display: block; }
.kpi span { color: var(--mut); font-size: 13px; }

.chip { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #fff; display: inline-block; }
.High { background: var(--H); }
.Medium { background: var(--M); }
.Low { background: var(--L); }

.bar { height: 7px; background: var(--bd); border-radius: 9px; overflow: hidden; min-width: 70px; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--pri); }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--bd); white-space: nowrap; }
th { color: var(--mut); font-size: 12px; text-transform: uppercase; cursor: pointer; user-select: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg); }

.tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
input, select, button { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); color: var(--tx); }
button { cursor: pointer; background: var(--pri); color: #fff; border: 0; transition: opacity 0.2s; }
button:hover { opacity: 0.9; }
button.alt { background: var(--card); color: var(--tx); border: 1px solid var(--bd); }
button:disabled { opacity: 0.4 !important; cursor: not-allowed !important; }

.scroll { overflow-x: auto; }
.ch { position: relative; height: 290px; }
ul.act { margin: 0; padding-left: 18px; }
ul.act li { margin: 6px 0; }

.pipeline-step { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--bg); border-radius: 10px; margin-bottom: 10px; }
.pipeline-number { width: 32px; height: 32px; border-radius: 50%; background: var(--pri); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; flex-shrink: 0; }

@media(max-width: 900px) {
  aside { position: static; width: auto; flex-direction: row; flex-wrap: wrap; }
  aside button { margin: 0; }
  main { margin: 0; padding: 16px; }
  .g4, .g2, .g3 { grid-template-columns: 1fr 1fr; }
}
@media(max-width: 560px) {
  .g4, .g2, .g3 { grid-template-columns: 1fr; }
}
</style>
</head>

const f1 = n => (+n).toFixed(1);
const chip = r => `<span class="chip ${r}">${r}</span>`;
const pb = v => `<div class="bar"><i style="width:${Math.min(100, Math.max(0, v))}%"></i></div>`;

let charts = [];

let isConnectedToApi = false;

function mkChart(id, cfg) {
  const el = $('#' + id);
  if (!el) return;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  charts.push(new Chart(el, cfg));
}

function toggleTheme() {
  const r = document.documentElement;
  r.dataset.theme = (r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')) == 'dark' ? 'light' : 'dark';
  route();
}

async function checkApiConnection() {
  const badge = $('#statusBadge');
  try {
    const res = await fetch(API_URL + "/api/summary");
    if (res.ok) {
      try {
        const stRes = await fetch(API_URL + "/api/students");
        if (stRes.ok) {
          const apiData = await stRes.json();
          if (Array.isArray(apiData) && apiData.length > 0) {
            S = apiData;
          }
        }
      } catch (err) {}
      isConnectedToApi = true;
      badge.textContent = "✓ API Connected";
      badge.className = "status-badge ok";
      return;
    }
  } catch (e) {
    // API offline
  }
  isConnectedToApi = false;
  badge.textContent = "● Standalone Data";
  badge.className = "status-badge local";
}

window.getFilteredStudents = function() {
  return S.filter(s => 
    (!st.q || (s.student_id + " " + (s.name || "")).toLowerCase().includes(st.q.toLowerCase())) && 
    (!st.dept || s.department == st.dept) && 
    (!st.risk || s.final_risk == st.risk)
  );
};

window.goToPage = function(p) {
  const filtered = window.getFilteredStudents();
  const totalPages = Math.ceil(filtered.length / 15) || 1;
  st.page = Math.max(0, Math.min(p, totalPages - 1));
  route();
};

window.prevPage = function() {
  window.goToPage(st.page - 1);
};

window.nextPage = function() {
  window.goToPage(st.page + 1);
};

                <td>${f1(s.assignment_completion)}%</td>
              </tr>
            `).join('') : `<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--mut)">No students match your filter criteria.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="tools" style="margin-top:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="alt" onclick="prevPage()" ${st.page <= 0 ? 'disabled' : ''}>◄ Prev</button>
          ${pageBtns}
          <button class="alt" onclick="nextPage()" ${st.page >= totalPages - 1 ? 'disabled' : ''}>Next ►</button>
        </div>
        <span style="font-weight:600;color:var(--tx)">Page ${st.page + 1} of ${totalPages} (${n} total students)</span>
      </div>`
    };
  },
  
  alerts: () => {
    const a = S.filter(s => s.final_risk == 'High').sort((x, y) => y.ml_risk_probability - x.ml_risk_probability);
    return {
      h: `<h2>Risk Alerts</h2><p class="sub">${a.length} high-risk students requiring immediate intervention & faculty counseling</p>
      ${a.map(s => `
        <div class="card" style="margin-bottom:12px;cursor:pointer" onclick="location.hash='#/s/${s.student_id}'">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
            <b>${s.student_id} · ${s.name} (${s.department}, Sem ${s.semester})</b>
            <span>${chip('High')} <b>${Math.round(s.ml_risk_probability * 100)}%</b> fail probability</span>
          </div>
          <ul class="act">${s.recommended_actions.split(' | ').map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
      `).join('')}`
    };
  },
  
  analytics: () => ({
    h: `<h2>Analytics</h2><p class="sub">Behavioral and academic correlation across risk levels</p>
    <div class="grid g2">
      <div class="card"><h3>Attendance vs CGPA</h3><p>Each marker is a student, colored by risk tier</p><div class="ch"><canvas id="c1"></canvas></div></div>
      <div class="card"><h3>Average Metrics by Risk Group</h3><p>Attendance %, Assignments %, Internal marks (% scale)</p><div class="ch"><canvas id="c2"></canvas></div></div>
      <div class="card"><h3>Study vs Distraction Hours</h3><p>Daily average study vs distraction hours per risk level</p><div class="ch"><canvas id="c3"></canvas></div></div>
      <div class="card"><h3>Average Score by Department</h3><p>Overall performance score (out of 100)</p><div class="ch"><canvas id="c4"></canvas></div></div>
    </div>`,
    i: () => {
      const R = ['High', 'Medium', 'Low'], g = r => S.filter(s => s.final_risk == r);
      mkChart('c1', {
        type: 'scatter',
        data: {
          datasets: R.map(r => ({ label: r, backgroundColor: C[r], data: g(r).map(s => ({ x: s.avg_attendance, y: s.cgpa })) }))
        },
        options: { scales: { x: { title: { display: true, text: 'Attendance %' } }, y: { title: { display: true, text: 'CGPA' } } } }
      });
      mkChart('c2', {
        type: 'bar',
        data: {
          labels: R,
          datasets: [
            ['avg_attendance', 'Attendance', '#4f46e5'],
            ['assignment_completion', 'Assignments', '#0ea5e9'],
            ['avg_internal', 'Internal marks', '#14b8a6']
          ].map(([k, l, c]) => ({ label: l, backgroundColor: c, data: R.map(r => +f1(avg(g(r), k) * (k == 'avg_internal' ? 2.5 : 1))) }))
        }
      });
      mkChart('c3', {
        type: 'bar',
        data: {
          labels: R,
          datasets: [
            { label: 'Study hrs', backgroundColor: '#16a34a', data: R.map(r => +f1(avg(g(r), 'avg_study_hours'))) },
            { label: 'Distraction hrs', backgroundColor: '#dc2626', data: R.map(r => +f1(avg(g(r), 'avg_distraction_hours'))) }
          ]
        }
      });
      mkChart('c4', {
        type: 'bar',
        data: {
          labels: depts,
          datasets: [{ label: 'Score', backgroundColor: '#4f46e5', data: depts.map(d => +f1(avg(S.filter(s => s.department == d), 'performance_score'))) }]
        },
        options: { indexAxis: 'y', plugins: { legend: { display: false } } }
      });
    }
  }),
  
  model: () => ({
    h: `<h2>Model Insights</h2><p class="sub">Spark MLlib & Machine Learning model performance evaluating early risk indicators</p>
    <div class="grid g2">
      <div class="card scroll">
        <h3>Model Performance Comparison</h3><p>Evaluated on 20% hold-out test set</p>
        <table>
          <thead><tr><th>Model</th><th>Accuracy</th><th>Recall</th><th>AUC</th></tr></thead>
          <tbody>${D.metrics.map(m => `<tr><td><b>${m.model}</b></td><td>${m.accuracy}</td><td>${m.recall_at_risk}</td><td>${m.auc}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <h3>What Drives Academic Risk?</h3><p>Random Forest feature importance weights</p>
        <div class="ch"><canvas id="c1"></canvas></div>
      </div>
    </div>`,
    i: () => {
      mkChart('c1', {
        type: 'bar',
        data: {
          labels: D.importance.map(x => x.feature),
          datasets: [{ data: D.importance.map(x => +x.importance.toFixed(3)), backgroundColor: '#8b5cf6' }]
        },
        options: { indexAxis: 'y', plugins: { legend: { display: false } } }
      });
    }
  }),
  
  pipeline: () => ({
    h: `<h2>Data Pipeline Architecture</h2><p class="sub">End-to-end data processing workflow from CSV datasets to API & UI Dashboard</p>
    <div class="card">
      <div class="pipeline-step"><div class="pipeline-number">1</div><div><strong>Raw CSV Datasets</strong><p style="margin:2px 0 0;font-size:12px">Students, attendance, assignments, marks, LMS log, and study behavior datasets</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">2</div><div><strong>Python Data Processing</strong><p style="margin:2px 0 0;font-size:12px">Data cleaning, aggregation, feature engineering, and feature scaling</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">3</div><div><strong>HDFS Storage</strong><p style="margin:2px 0 0;font-size:12px">Distributed storage system for multi-modal student logs</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">4</div><div><strong>Hive External Tables</strong><p style="margin:2px 0 0;font-size:12px">SQL query engine interface for scalable analytical processing</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">5</div><div><strong>Spark MLlib Classifier</strong><p style="margin:2px 0 0;font-size:12px">Random Forest & Logistic Regression risk classification model</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">6</div><div><strong>Flask REST API Backend</strong><p style="margin:2px 0 0;font-size:12px">Serves endpoints for summary, distribution, alerts, analytics & student details</p></div></div>
      <div class="pipeline-step"><div class="pipeline-number">7</div><div><strong>EduRisk Web Dashboard</strong><p style="margin:2px 0 0;font-size:12px">Interactive visualization and student risk intelligence console</p></div></div>
    </div>`
  })
};

function prof(id) {
  const s = S.find(x => x.student_id == id);
  if (!s) return { h: '<h2>Student not found</h2><a href="#/students">← Back to students</a>' };
  
  const mx = Math.max(...S.map(x => x.lms_logins));
  const n = x => [x.avg_attendance, x.cgpa * 10, x.assignment_completion, x.avg_internal * 2.5, (x.lms_logins / mx) * 100, x.avg_study_hours * 12.5];
  
  return {
    h: `<a href="#/students" style="color:var(--pri);text-decoration:none;font-weight:600">← Back to students</a>
    <h2 style="margin-top:10px">${s.student_id} · ${s.name}</h2>
    <p class="sub">${s.department} · Semester ${s.semester} · ${chip(s.final_risk)} · ${s.performance_band} performer</p>
    <div class="grid g4">
      <div class="card kpi"><span>Performance Score</span><b>${f1(s.performance_score)}</b></div>
      <div class="card kpi"><span>Fail Probability</span><b style="color:${C[s.final_risk]}">${Math.round(s.ml_risk_probability * 100)}%</b></div>
      <div class="card kpi"><span>CGPA</span><b>${f1(s.cgpa)}</b></div>
      <div class="card kpi"><span>Subjects Failed</span><b>${s.subjects_failed}</b></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h3>Profile vs Class Average</h3><p>All metrics normalized (0 - 100)</p><div class="ch"><canvas id="c1"></canvas></div></div>
      <div class="card"><h3>Subject Performance Breakdown</h3><p>Attendance % & Total Marks per subject</p><div class="ch"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>AI Intervention & Recommended Actions</h3>
      <p>Action items generated by the risk intelligence agent</p>
      <ul class="act">${s.recommended_actions.split(' | ').map(x => `<li>${x}</li>`).join('')}</ul>
    </div>`,
    i: () => {
      const classAvg = S.map(n).reduce((t, r) => t.map((v, i) => v + r[i] / S.length), [0, 0, 0, 0, 0, 0]);
      mkChart('c1', {
        type: 'radar',
        data: {
          labels: ['Attendance', 'CGPA', 'Assignments', 'Internal marks', 'LMS activity', 'Study hours'],
          datasets: [
            { label: 'Student', data: n(s), borderColor: C[s.final_risk], backgroundColor: C[s.final_risk] + '33' },
            { label: 'Class average', data: classAvg, borderColor: '#94a3b8', backgroundColor: '#94a3b822' }
          ]
        },
        options: { scales: { r: { min: 0, max: 100 } } }
      });
      mkChart('c2', {
        type: 'bar',
        data: {
          labels: D.subjects,
          datasets: [
            { label: 'Attendance %', backgroundColor: '#4f46e5', data: s.att },
            { label: 'Total Marks', backgroundColor: '#14b8a6', data: s.mk }
          ]
        }
      });
    }
  };
}

function srt(k) {
  st.dir = st.key == k ? -st.dir : 1;
  st.key = k;
  route();
}

function rr() {
  const active = document.activeElement;
  route();
  const inp = document.querySelector('input');
  if (inp && active && active.tagName == 'INPUT') {
    inp.focus();
    inp.setSelectionRange(99, 99);
  }
}

function exp() {
  if (isConnectedToApi) {
    window.location.href = API_URL + "/api/export-csv";
    return;
  }
  const rows = [['student_id', 'department', 'final_risk', 'performance_score', 'avg_attendance', 'cgpa']];
  S.forEach(s => rows.push([s.student_id, s.department, s.final_risk, s.performance_score, s.avg_attendance, s.cgpa]));
  const csvStr = rows.map(e => e.join(',')).join('\n');
  const blob = new Blob([csvStr], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'students.csv';
  a.click();
}

function route() {
  charts.forEach(c => c.destroy());
  charts = [];
  const h = location.hash.replace('#/', '');
  const m = h.match(/^s\/(.+)/);
  const k = m ? null : h.split('/')[0];
  const p = m ? prof(m[1]) : (P[k] ? P[k]() : P['']());
  
  Chart.defaults.color = getComputedStyle(document.body).getPropertyValue('--mut');
  Chart.defaults.borderColor = getComputedStyle(document.body).getPropertyValue('--bd');
  
  $('#app').innerHTML = p.h;
  document.querySelectorAll('aside a').forEach(a => a.classList.toggle('on', a.dataset.p == (m ? 'students' : k)));
  if (p.i) p.i();
}

addEventListener('hashchange', route);
checkApiConnection().then(route);
</script>
</body>
</html>
